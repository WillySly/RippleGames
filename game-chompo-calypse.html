<main class="game">

  <!-- PLAY block -->
  <div class="game__framewrap">
    <button id="btnFullscreen" class="btn btn--primary game__fs">Fullscreen</button>
    <iframe id="gameFrame" class="game__iframe"
            src="/webgl/chompocalypse/index.html"
            allow="fullscreen"
            allowfullscreen></iframe>
  </div>

</main>


<script>
  // Keep iframe the same size as its wrapper
  function sizeIframe() {
    const iframe = document.getElementById('gameFrame');
    const wrap = document.querySelector('.game__framewrap');
    if (!iframe || !wrap) return;
    iframe.style.width  = wrap.offsetWidth + 'px';
    iframe.style.height = wrap.offsetHeight + 'px';
  }
  addEventListener('load', sizeIframe);
  addEventListener('resize', sizeIframe);
</script>

<script>
  // Fullscreen toggle for the iframe
  (function () {
    const btn = document.getElementById('btnFullscreen');
    const iframe = document.getElementById('gameFrame');

    function isFS() { return document.fullscreenElement || document.webkitFullscreenElement; }
    function enterFS(el){ return el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen?.(); }
    function exitFS(){ return document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen?.(); }

    btn.addEventListener('click', async () => {
      if (isFS()) { await exitFS(); btn.textContent = 'Fullscreen'; }
      else        { await enterFS(iframe); btn.textContent = 'Exit Fullscreen'; }
    });
  })();
</script>

<script>
  // Patch Unity canvas backing store inside the iframe (same-origin)
  (function () {
    const IFRAME_ID = 'gameFrame';
    const DPR_CAP = 1.5;                     // tame HiDPI jumps in Chrome
    const RAF_DELAY = 16;                    // allow layout to settle

    function patchUnityResizer(iframe) {
      const w = iframe.contentWindow;
      if (!w) return;

      function syncCanvasBackingStore() {
        const d = w.document;
        const canvas = d && d.getElementById('unity-canvas');
        if (!canvas) return;

        const cssW = canvas.clientWidth  || canvas.width  || 0;
        const cssH = canvas.clientHeight || canvas.height || 0;
        if (!cssW || !cssH) return;

        const dpr = Math.min(w.devicePixelRatio || 1, DPR_CAP);
        const bufW = Math.round(cssW * dpr);
        const bufH = Math.round(cssH * dpr);

        if (canvas.width !== bufW || canvas.height !== bufH) {
          canvas.width  = bufW;
          canvas.height = bufH;
          const Module = (w.unityInstance && w.unityInstance.Module) || w.Module;
          if (Module && typeof Module.setCanvasSize === 'function') {
            Module.setCanvasSize(bufW, bufH);
          }
        }
      }

      function hook() {
        // keep Unity’s original onResize
        const orig = typeof w.onResize === 'function' ? w.onResize : null;
        w.onResize = function () {
          orig && orig();
          // sync after Unity finishes its CSS changes
          setTimeout(() => requestAnimationFrame(syncCanvasBackingStore), RAF_DELAY);
        };

        // initial syncs
        syncCanvasBackingStore();
        // events that often produce the square-backing-store issue
        w.addEventListener('resize', () => setTimeout(syncCanvasBackingStore, RAF_DELAY));
        w.addEventListener('orientationchange', () => setTimeout(syncCanvasBackingStore, RAF_DELAY));
        if (w.visualViewport) {
          w.visualViewport.addEventListener('resize', () => setTimeout(syncCanvasBackingStore, RAF_DELAY));
        }

        // when parent toggles fullscreen on the iframe, resync
        document.addEventListener('fullscreenchange', () => {
          if (document.fullscreenElement === iframe) {
            setTimeout(syncCanvasBackingStore, 120);
          }
        });
      }

      // Wait until Unity inserted unityInstance/canvas
      const timer = setInterval(() => {
        try {
          if (w.document.getElementById('unity-canvas')) {
            clearInterval(timer);
            hook();
          }
        } catch (_) {}
      }, 150);

      iframe.addEventListener('load', () => {
        try { hook(); } catch (_) {}
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      const iframe = document.getElementById(IFRAME_ID);
      if (!iframe) return;
      if (iframe.contentWindow && iframe.contentDocument?.readyState === 'complete') {
        patchUnityResizer(iframe);
      }
      iframe.addEventListener('load', () => patchUnityResizer(iframe));
    });
  })();
</script>

<script>
  // Fallback for browsers without dvh (and to handle mobile URL-bar changes)
  (function () {
    function setVH(){
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    setVH();
    addEventListener('resize', setVH);
    addEventListener('orientationchange', setVH);
  })();
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const toggleButton = document.getElementById('menu-toggle');
    const collapsibleMenu = document.getElementById('navbar-collapsible');

    toggleButton.addEventListener('click', function() {
        // Toggle the 'open' class on the collapsible wrapper
        collapsibleMenu.classList.toggle('open');
        
        // Update ARIA attribute for accessibility
        const isExpanded = toggleButton.getAttribute('aria-expanded') === 'true' || false;
        toggleButton.setAttribute('aria-expanded', !isExpanded);
        
        // Optional: Animate the hamburger icon (if you add the CSS for it)
        toggleButton.classList.toggle('is-active'); 
    });

    // Optional: Close menu when a link is clicked (useful for anchor links)
    collapsibleMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function() {
            collapsibleMenu.classList.remove('open');
            toggleButton.setAttribute('aria-expanded', 'false');
            toggleButton.classList.remove('is-active');
        });
    });
  });
</script>
