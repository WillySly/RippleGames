<script>
  document.addEventListener("DOMContentLoaded", function () {


    const toggleButton = document.getElementById('menu-toggle');
    const collapsibleMenu = document.getElementById('navbar-collapsible');

    toggleButton.addEventListener('click', function() {
        // Toggle the 'open' class on the collapsible wrapper
        collapsibleMenu.classList.toggle('open');
        
        // Update ARIA attribute for accessibility
        const isExpanded = toggleButton.getAttribute('aria-expanded') === 'true' || false;
        toggleButton.setAttribute('aria-expanded', !isExpanded);
        
        // Optional: Animate the hamburger icon (if you add the CSS for it)
        toggleButton.classList.toggle('is-active'); 
    });

    // Optional: Close menu when a link is clicked (useful for anchor links)
    collapsibleMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function() {
            collapsibleMenu.classList.remove('open');
            toggleButton.setAttribute('aria-expanded', 'false');
            toggleButton.classList.remove('is-active');
        });
    });

    document.addEventListener('DOMContentLoaded', function() {
    // 1. Get the URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    
    // 2. Read the value of the 'q' parameter (the search query)
    let query = urlParams.get('q');
    
    // 3. Get the element where the query will be displayed
    const displayElement = document.getElementById('searchQueryDisplay');

    if (query && displayElement) {
        // Decode URI component (e.g., handles spaces and special characters)
        query = decodeURIComponent(query.trim());
        
        // Ensure the query is not empty after trimming
        if (query !== "") {
            // Prepend a '#' and display the text
            displayElement.textContent = '#' + query.toLowerCase().replace(/ /g, '');
        } else {
            // Handle case where query is empty (optional)
            displayElement.textContent = '#';
        }
    } else if (displayElement) {
        // Handle case where no query parameter exists (e.g., direct page load)
        displayElement.textContent = '#';
    }
});
  });
</script>
