<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ripple Games</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="img/maria.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/maria.png" sizes="180x180">
  <link rel="shortcut icon" href="img/maria.png">
  <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
/>
<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
</head>
<body>

<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-logo">
      <a href="/"><img src="img/logo.png" alt="Ripple Games logo" class="logo" /></a>
    </div>

    <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-label="Toggle navigation">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
    <div class="navbar-collapsible" id="navbar-collapsible">
      <nav class="navbar-links">
        <a class="navbar-link" href="/#featured">Our Games</a>
        <a class="navbar-link" href="/#about">About Us</a>
        <a class="navbar-link" href="/#clients">Our Clients</a>
        <a class="navbar-link" href="/#contact">Contact</a>
      </nav>

      <div class="navbar-actions">
        <form action="/search.html" method="GET" class="search-form" >
        <div class="search-box">
            <input type="text" placeholder="Search" class="search-input" name="q">
            <button class="search-icon">
                &#x1F50D;
            </button>
        </div>
      </form>
      <!-- <div class="lang-switcher">
          <span class="lang-option active">EN</span>
          <span class="lang-divider">|</span>
          <span class="lang-option inactive">GE</span>
      </div> -->
  </div>
    </div>

    
  </div>
</nav>

<main class="search-results-page">
    <section class="search-header">
        <h1 class="search-title">SEARCH RESULT FOR</h1>
        <span class="search-term-tag" id="searchQueryDisplay">#searchtag</span>
    </section>

    <section class="game-card-grid" id="resultsGrid"></section>
    <p class="search-no-results" id="noResults" style="display:none;">No games found.</p>
</main>

<script>
  const GAMES = [
    {
      title: "CHOMPO-CALYPSE",
      image: "img/game-cards/ChompocalypseCard.png",
      link: "/game-chompo-calypse.html",
      tags: ["undp", "e-waste", "educational", "ripplegames"]
    },
    {
      title: "AWOOO",
      image: "img/game-cards/AWOOOCard.png",
      link: null,
      tags: ["ripplegames"]
    }
  ];

  document.addEventListener("DOMContentLoaded", function () {
    const toggleButton = document.getElementById('menu-toggle');
    const collapsibleMenu = document.getElementById('navbar-collapsible');

    toggleButton.addEventListener('click', function() {
      collapsibleMenu.classList.toggle('open');
      const isExpanded = toggleButton.getAttribute('aria-expanded') === 'true';
      toggleButton.setAttribute('aria-expanded', !isExpanded);
      toggleButton.classList.toggle('is-active');
    });

    collapsibleMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', function() {
        collapsibleMenu.classList.remove('open');
        toggleButton.setAttribute('aria-expanded', 'false');
        toggleButton.classList.remove('is-active');
      });
    });

    const urlParams = new URLSearchParams(window.location.search);
    let query = urlParams.get('q');
    const displayElement = document.getElementById('searchQueryDisplay');
    const grid = document.getElementById('resultsGrid');
    const noResults = document.getElementById('noResults');

    if (query) {
      query = decodeURIComponent(query.trim());
    }

    if (query) {
      displayElement.textContent = '#' + query.toLowerCase().replace(/ /g, '');
    } else {
      displayElement.textContent = '#';
    }

    const needle = (query || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const matches = GAMES.filter(g =>
      g.tags.some(t => t.replace(/[^a-z0-9]/g, '').includes(needle)) ||
      g.title.toLowerCase().replace(/[^a-z0-9]/g, '').includes(needle)
    );

    if (matches.length === 0) {
      noResults.style.display = '';
    } else {
      matches.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.style.backgroundImage = `url('${game.image}')`;
        if (game.link) {
          card.style.cursor = 'pointer';
          card.addEventListener('click', () => window.location = game.link);
        }
        const tagHtml = game.tags.map(t =>
          `<a href="/search.html?q=${encodeURIComponent(t)}" onclick="event.stopPropagation()"><span class="tag">#${t.toUpperCase()}</span></a>`
        ).join('');
        card.innerHTML = `
          <div class="card-content">
            <h2 class="card-title">${game.title}</h2>
            <div class="card-tags">${tagHtml}</div>
          </div>`;
        grid.appendChild(card);
      });
    }
  });
</script>

</body>
</html>
