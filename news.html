<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="News and updates from Ripple Games." />
  <title>News – Ripple Games</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="img/maria.png" type="image/png" sizes="32x32">
</head>
<body>
<nav class="navbar" aria-label="Main navigation">
  <div class="navbar-container">
    <div class="navbar-logo">
      <a href="/" aria-label="Ripple Games home"><img src="img/logo.png" alt="" class="logo" /></a>
    </div>
    <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="navbar-collapsible" aria-label="Toggle navigation">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>
    <div class="navbar-collapsible" id="navbar-collapsible">
      <div class="navbar-links">
        <a class="navbar-link" href="/#about">About Us</a>
        <a class="navbar-link" href="/games.html">Games</a>
        <a class="navbar-link" href="/projects.html">Projects</a>
        <a class="navbar-link" href="/news.html" aria-current="page">News</a>
        <a class="navbar-link" href="/#contact">Contact</a>
      </div>
      <div class="navbar-actions">
        <form action="/search.html" method="GET" class="search-form">
          <div class="search-box">
            <input type="search" placeholder="Search" class="search-input" name="q" aria-label="Search">
            <button class="search-icon" aria-label="Submit search">&#x1F50D;</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</nav>

<main class="content-page">
  <header class="content-page__hero">
    <p class="content-page__eyebrow">Stories & updates</p>
    <h1 class="content-page__title">News</h1>
    <p class="content-page__intro">Activities, events, launches, and stories from Ripple Games and the projects connected to them.</p>
  </header>

  <section class="content-section" aria-labelledby="latest-news">
    <div class="empty-state">
      <h2 id="latest-news">No published news yet</h2>
      <p>New posts will appear here once the publishing workflow is available.</p>
    </div>
  </section>
</main>
<script src="js/navigation.js"></script>
</body>
</html>
